# Failed SnappyMail logins, user and admin panel, as written to
# _data_/_default_/logs/auth.log:
#
#   [2026-10-30 12:00:00] Auth failed: ip=203.0.113.7 user=info@example.com ...
#   [2026-10-30 12:00:00] Admin Auth failed: ip=203.0.113.7 user=admin ...
#
# Copied to /etc/fail2ban/filter.d/ by bin/setup.sh.

[Definition]
failregex = ^\s*(?:Admin )?Auth failed: ip=<HOST> user=
ignoreregex =

[Init]
# Without an explicit pattern fail2ban does not recognise the bracketed date
# and no line matches.
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
